<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Matneco+ &mdash; Sign In</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=EB+Garamond:ital,wght@0,400;0,500;1,400&family=DM+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

  :root {
    --ink: #e8e4dc;
    --paper: #0c0b09;
    --surface: #141210;
    --muted: #7a756c;
    --rule: #2a2720;
    --gold: #b8964a;
    --error: #c47a7a;
    --error-bg: #1a0f0f;
    --error-border: #3a1f1f;
  }

  body {
    background: var(--paper);
    color: var(--ink);
    font-family: 'EB Garamond', Georgia, serif;
    min-height: 100vh;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    padding: 2rem 1.5rem;
  }

  .card {
    width: 100%;
    max-width: 400px;
    background: var(--surface);
    border: 1px solid var(--rule);
    padding: 3rem 2.5rem 2.5rem;
  }

  .brand {
    text-align: center;
    margin-bottom: 2.5rem;
  }

  .brand-name {
    font-family: 'DM Mono', monospace;
    font-size: 0.62rem;
    letter-spacing: 0.2em;
    text-transform: uppercase;
    color: var(--muted);
    display: block;
    margin-bottom: 0.5rem;
  }

  .brand h1 {
    font-size: 2rem;
    font-weight: 400;
    letter-spacing: -0.01em;
    color: var(--ink);
  }

  .brand h1 em {
    color: var(--gold);
    font-style: italic;
  }

  .field {
    margin-bottom: 1.25rem;
  }

  label {
    display: block;
    font-family: 'DM Mono', monospace;
    font-size: 0.62rem;
    letter-spacing: 0.15em;
    text-transform: uppercase;
    color: var(--muted);
    margin-bottom: 0.5rem;
  }

  input {
    width: 100%;
    padding: 0.75rem 1rem;
    font-family: 'DM Mono', monospace;
    font-size: 0.85rem;
    background: var(--paper);
    border: 1px solid var(--rule);
    color: var(--ink);
    outline: none;
    transition: border-color 0.15s;
    -webkit-appearance: none;
    border-radius: 0;
  }

  input:focus { border-color: var(--gold); }

  input::placeholder { color: #3a3730; }

  .error {
    display: none;
    background: var(--error-bg);
    border: 1px solid var(--error-border);
    color: var(--error);
    font-size: 0.88rem;
    padding: 0.75rem 1rem;
    margin-bottom: 1.25rem;
    font-style: italic;
  }

  .error.visible { display: block; }

  button {
    width: 100%;
    padding: 0.85rem;
    background: var(--gold);
    color: #0c0b09;
    border: none;
    font-family: 'DM Mono', monospace;
    font-size: 0.68rem;
    letter-spacing: 0.2em;
    text-transform: uppercase;
    cursor: pointer;
    transition: background 0.15s;
    margin-top: 0.5rem;
    border-radius: 0;
    font-weight: 500;
  }

  button:hover { background: #cba85a; }
  button:active { background: #a07c38; }

  .back {
    text-align: center;
    margin-top: 2rem;
  }

  .back a {
    font-family: 'DM Mono', monospace;
    font-size: 0.62rem;
    letter-spacing: 0.12em;
    text-transform: uppercase;
    color: var(--muted);
    text-decoration: none;
    transition: color 0.15s;
  }

  .back a:hover { color: var(--ink); }

  @media (max-width: 480px) {
    .card { padding: 2.5rem 1.75rem 2rem; }
  }
</style>
</head>
<body>

<div class="card">
  <div class="brand">
    <span class="brand-name">Matneco Industries</span>
    <h1>Matneco<em>+</em></h1>
  </div>

  <div class="error" id="error">Incorrect username or password.</div>

  <div class="field">
    <label for="username">Username</label>
    <input type="text" id="username" placeholder="your mountain" autocomplete="username" autocapitalize="none" spellcheck="false">
  </div>

  <div class="field">
    <label for="password">Password</label>
    <input type="password" id="password" placeholder="••••••••••" autocomplete="current-password">
  </div>

  <button onclick="attemptLogin()">Sign in &rarr;</button>

  <div class="back">
    <a href="/">&larr; Matneco Industries</a>
  </div>
</div>

<script>
  const USERS = {
    marcy:          'Kx9#mR4vLq',
    algonquin:      'Pz2$wN7jTy',
    haystack:       'Bq5!dF8sXm',
    skylight:       'Yw3@hC6nVk',
    whiteface:      'Tm8#rJ2pGe',
    dix:            'Lf4$bQ9uZw',
    gray:           'Nc7!xK3oRv',
    iroquois:       'Hs6@mD5tAj',
    basin:          'Wp1#fY8cLn',
    gothics:        'Eq9$gB4kMx',
    colden:         'Rv2!jS7wPd',
    giant:          'Ak5@nT3hFz',
    nippletop:      'Ux8#oW6yQb',
    santanoni:      'Cm3$vR1eKs',
    redfield:       'Jg7!pL9mDt',
    wright:         'Fb4@xN2uHy',
    saddleback:     'Zw6#kG5rAe',
    panther:        'Qn1$cJ8vBm',
    tabletop:       'Yd9!sF3wLp',
    rockypeakridge: 'Th5@bX7nCq',
  };

  const DESTINATION = 'https://plus.matneco.com';

  function attemptLogin() {
    const username = document.getElementById('username').value.trim().toLowerCase();
    const password = document.getElementById('password').value;
    const error = document.getElementById('error');

    if (USERS[username] && USERS[username] === password) {
      error.classList.remove('visible');
      window.location.href = DESTINATION;
    } else {
      error.classList.add('visible');
      document.getElementById('password').value = '';
      document.getElementById('password').focus();
    }
  }

  document.addEventListener('keydown', function(e) {
    if (e.key === 'Enter') attemptLogin();
  });
</script>

</body>
</html>
